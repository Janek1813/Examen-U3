<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validador de Expresiones Regulares</title>
  <link rel="stylesheet" href="public/styles.css" />
</head>
<body>
  <main class="card">
    <h1>Validador de Expresiones Regulares</h1>

    <label for="er">Expresión regular</label>
    <input id="er" type="text" placeholder="Ej: ^[A-Z][a-z]+$" />

    <label for="texto">Texto</label>
    <input id="texto" type="text" placeholder="Escribe el texto aquí" />

    <div class="botones">
      <button id="comparar" class="btn azul">Comparar</button>
      <button id="limpiar" class="btn gris">Limpiar</button>
    </div>

    <p id="resultado"></p>
  </main>

  <div id="alertas"></div>

  <script src="bundle.js"></script>
</body>
</html>
